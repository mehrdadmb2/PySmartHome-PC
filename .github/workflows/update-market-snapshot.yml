name: Update compact market snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Project CI and firmware verification"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-market-snapshot
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Fetch, validate and publish compact prices
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and generate market snapshots (API + raw + CDN + Pages fallbacks)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_market_snapshot.py
      - name: Validate generated snapshots and freshness metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("market/esp32.json"),
              Path("market/currencies/usd.json"),
              Path("market/metals/gold_18k_1g.json"),
              Path("market/status.json"),
          ]
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"Invalid JSON object: {path}"
              print(f"PASS {path}: {path.stat().st_size} bytes")
          board = json.loads(Path("market/esp32.json").read_text(encoding="utf-8"))
          assert board.get("v") == 1
          assert 0 < int(board["usd_toman"]) < 10**12
          assert 0 < int(board["gold18k_toman"]) < 10**12
          assert Path("market/esp32.json").stat().st_size <= 512
          print("PASS board payload <= 512 bytes")
          PY
      - name: Commit and push only when data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/
          if git diff --cached --quiet; then
            echo "No market changes; keeping the current snapshot."
            exit 0
          fi
          git commit -m "data: refresh compact market snapshots [skip ci]"
          # A local sensor-data publish can race this workflow. Rebase and retry
          # instead of losing a valid market refresh on a non-fast-forward push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Market snapshot pushed successfully."
              exit 0
            fi
            echo "Push attempt ${attempt}/3 failed; retrying after a short delay."
            sleep $((attempt * 3))
          done
          echo "::error::Could not publish market snapshot after three push attempts."
          exit 1
